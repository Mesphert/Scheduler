<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Scheduler</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1 id="pageTitle">Fixtures</h1>
    <button id="refresh" class="icon-btn" aria-label="Refresh">↻</button>
  </header>

  <main>
    <section id="tab-fixtures" class="tab"></section>

    <section id="tab-schedule" class="tab" hidden>
      <div class="card form">
        <input id="cTitle" class="field" type="text" placeholder="Custom reminder title" />
        <input id="cWhen" class="field" type="datetime-local" />
        <button id="addCustom" class="btn wide">Add custom reminder</button>
      </div>
      <div id="schedList"></div>
    </section>

    <section id="tab-settings" class="tab" hidden></section>
  </main>

  <nav class="tabbar">
    <button data-tab="fixtures" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Fixtures</span>
    </button>
    <button data-tab="schedule">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 1 1 12 0v6l2 2H4l2-2z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
      <span>Schedule</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div id="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
